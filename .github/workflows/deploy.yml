name: Employee Management CI/CD

on:

  push:

    branches:

      - main

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository

      uses: actions/checkout@v4

    - name: Show System Information

      run: |

        pwd

        ls -la

        hostname

        whoami

        docker --version

    - name: Login to Docker Hub

      uses: docker/login-action@v3

      with:

        username: ${{ secrets.DOCKER_USERNAME }}

        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Backend Image

      run: |

        docker build -t ${{ secrets.DOCKER_USERNAME }}/employee-backend:latest ./backend

    - name: Build Frontend Image

      run: |

        docker build -t ${{ secrets.DOCKER_USERNAME }}/employee-frontend:latest ./frontend

    - name: Push Backend Image

      run: |

        docker push ${{ secrets.DOCKER_USERNAME }}/employee-backend:latest

    - name: Push Frontend Image

      run: |

        docker push ${{ secrets.DOCKER_USERNAME }}/employee-frontend:latest

    - name: Deploy to EC2

      uses: appleboy/ssh-action@v1.0.3

      with:

        host: ${{ secrets.EC2_HOST }}

        username: ${{ secrets.EC2_USER }}

        key: ${{ secrets.EC2_SSH_KEY }}

        script: |

          cd Docker-Project-

          docker compose down

          docker pull ${{ secrets.DOCKER_USERNAME }}/employee-backend:latest

          docker pull ${{ secrets.DOCKER_USERNAME }}/employee-frontend:latest

          docker compose up -d

          docker ps
